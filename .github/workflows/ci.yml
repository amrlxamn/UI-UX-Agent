name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install scraper deps (skip Playwright)
        run: cd scraper && npm install --ignore-scripts
      - name: Run smoke tests
        run: node --test scraper/test/smoke.test.mjs
      - name: Run CLI integration tests
        run: node --test test/cli.test.mjs
